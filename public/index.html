<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>#connect</title>
<style>
  :root {
    --bg: #fff; --fg: #1f2328; --mute: #6b7078; --line: #e3e5e8;
    --soft: #f4f6f8; --frame: #c9ccd1; --blue: #2f9bd6; --bluebg: #e8f4fb;
    --green: #4fae6c; --red: #d9534f; --redbg: #fdf1f1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111315; --fg: #e8eaed; --mute: #9aa0a6; --line: #2a2d31;
      --soft: #1a1d20; --frame: #3a3e44; --bluebg: #12293a; --redbg: #2a1517;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    height: 100dvh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--fg);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0
      env(safe-area-inset-left);
  }
  /* fleet map: a box per node, a chip per channel */
  #nodes {
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    gap: 8px; padding: 10px 10px 8px;
  }
  .box {
    min-width: 0; padding: 6px; border: 2px dashed var(--frame);
    border-radius: 12px; transition: border-color .3s, background-color .3s;
  }
  .box h2 {
    display: flex; align-items: center; gap: 6px; margin: 0 0 6px;
    font: 600 13px ui-monospace, Menlo, monospace;
  }
  .box h2 i {
    width: 8px; height: 8px; margin-left: auto; flex: none;
    border-radius: 50%; background: var(--green);
  }
  .box.down { border-color: var(--red); background: var(--redbg); }
  .box.down h2 i { background: var(--red); }
  .box.down h2::after { content: "down"; order: 2; color: var(--red); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; min-height: 24px; }
  .chip {
    display: flex; align-items: center; gap: 4px; padding: 3px 6px;
    border-radius: 6px;
    background: var(--green); color: #fff; text-decoration: none;
    white-space: nowrap; font: 600 12px ui-monospace, Menlo, monospace;
  }
  .chip span { font-weight: 400; opacity: .85; }
  .chip.on { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--blue); }
  .chip.moving {
    background: transparent; color: var(--mute);
    outline: 2px dashed var(--mute); outline-offset: -2px;
  }
  /* channel */
  .bar {
    display: flex; align-items: baseline; gap: 10px; padding: 4px 14px 8px;
    border-bottom: 1px solid var(--line);
  }
  .bar h1 { margin: 0; font-size: 22px; }
  #status { color: var(--mute); font-size: 14px; }
  #status.bad { color: var(--red); font-weight: 600; }
  .bar a {
    margin-left: auto; padding: 4px 10px; border: 1px solid var(--line);
    border-radius: 999px; color: var(--blue); font-size: 14px;
    text-decoration: none; white-space: nowrap;
  }
  main { flex: 1; overflow-y: auto; padding: 8px 14px; }
  .msg { padding: 3px 0; overflow-wrap: anywhere; }
  .msg b { margin-right: 6px; font-weight: 600; }
  .msg.me {
    margin: 3px -9px; padding: 5px 9px; border-radius: 10px;
    background: var(--bluebg);
  }
  .msg.me b { color: var(--blue); }
  /* you, and the input */
  footer {
    padding: 8px 12px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line); background: var(--soft);
  }
  .you {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    color: var(--mute); font-size: 15px;
  }
  .you strong {
    padding: 3px 12px; border-radius: 999px; background: var(--blue);
    color: #fff; font-weight: 600;
  }
  form { display: flex; gap: 8px; }
  button, input { font: inherit; border-radius: 12px; }
  .you button {
    margin-left: auto; padding: 3px 10px; border: 1px solid var(--line);
    border-radius: 999px; background: none; color: var(--mute); font-size: 13px;
  }
  input {
    flex: 1; min-width: 0; padding: 11px 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--fg);
  }
  input:focus { outline: 2px solid var(--blue); outline-offset: -1px; }
  button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  form button {
    padding: 0 18px; border: 0; background: var(--blue); color: #fff;
    font-weight: 600;
  }
</style>
</head>
<body>
<div id="nodes"></div>
<div class="bar">
  <h1 id="title">#connect</h1><span id="status">connecting</span>
  <a href="https://github.com/ry/cf-connect-demo" target="_blank">source</a>
</div>
<main id="log" aria-live="polite"></main>
<footer>
  <div class="you">you are <strong id="me"></strong>
    <button id="reroll" type="button">new name</button></div>
  <form id="form">
    <input id="text" maxlength="280" placeholder="Say something"
      autocomplete="off" enterkeyhint="send" aria-label="Message">
    <button>Send</button>
  </form>
</footer>
<script>
const ADJECTIVES = `amber brave calm clever cosmic crimson curious daring eager
  fancy fuzzy gentle golden happy humble jolly kind lively lucky mellow mighty
  misty noble patient plucky quick quiet rapid rusty shiny silver sleepy snowy
  spicy sunny swift tidy witty zesty zippy`.split(/\s+/);
const ANIMALS = `badger bear beaver bison camel cobra crane crow dingo dolphin
  eagle falcon ferret fox gecko heron ibis jackal koala lemur lynx marmot moose
  newt ocelot otter owl panda puffin quokka raven seal sloth squid tapir tiger
  toucan walrus wombat yak`.split(/\s+/);

const $ = (id) => document.getElementById(id);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const sock = (path) =>
  new WebSocket(location.origin.replace("http", "ws") + path);

// ---- who you are ----
let nick;
function setNick(n) {
  $("me").textContent = nick = n;
  try { localStorage.setItem("nick", n); } catch {}
}
try { nick = localStorage.getItem("nick"); } catch {}
setNick(nick || `${pick(ADJECTIVES)}-${pick(ANIMALS)}`);
$("reroll").onclick = () => {
  setNick(`${pick(ADJECTIVES)}-${pick(ANIMALS)}`);
  connect();
};

// Each nick gets a stable color so people are easy to tell apart.
function hue(s) {
  let h = 0;
  for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return h;
}

// ---- fleet map ----
let nodes = [], fleet = [], down = []; // down: node ips that miss health checks
const boxes = new Map(); // node ip -> box
const chips = new Map(); // channel -> { el, ip }
const nameOf = (ip) => nodes.find((n) => n.ip === ip)?.name ?? ip;

function box(ip) {
  if (!boxes.has(ip)) {
    const el = document.createElement("section");
    el.className = "box";
    el.innerHTML = `<h2>${nameOf(ip)}<i></i></h2><div class="chips"></div>`;
    $("nodes").append(el);
    boxes.set(ip, el);
  }
  return boxes.get(ip);
}

function chip(c) {
  if (!chips.has(c)) {
    const el = document.createElement("a");
    el.className = "chip";
    el.href = "#" + c;
    el.innerHTML = `#${c}<span></span>`;
    chips.set(c, { el, ip: null });
  }
  return chips.get(c);
}

// Move each chip to its node's box, sliding it from where it was.
function render(m) {
  fleet = m.fleet;
  down = m.down ?? down;
  const els = [...chips.values()].map((r) => r.el);
  const first = new Map(els.map((el) => [el, el.getBoundingClientRect()]));
  for (const f of fleet) {
    // A channel that just started knows nothing yet; keep what we have.
    if (!f.up && !f.node && chips.has(f.c)) continue;
    const rec = chip(f.c);
    rec.el.classList.toggle("moving", !f.up);
    rec.el.classList.toggle("on", f.c === channel);
    rec.el.querySelector("span").textContent = f.up ? f.conns : "moving";
    if (f.node && rec.ip !== f.node) {
      box(f.node).querySelector(".chips").append(rec.el);
      rec.ip = f.node;
    }
  }
  for (const [el, a] of first) {
    const b = el.getBoundingClientRect();
    const dx = a.left - b.left, dy = a.top - b.top;
    if (a.width && (dx || dy)) {
      const from = { transform: `translate(${dx}px, ${dy}px)` };
      el.animate([from, { transform: "none" }],
        { duration: 900, easing: "cubic-bezier(.2,.8,.2,1)" });
    }
  }
  // A node is down when health checks say so or, sooner, when all its
  // channels are moving.
  for (const [ip, el] of boxes) {
    const mine = [...chips.values()].filter((r) => r.ip === ip);
    const moving = (r) => r.el.classList.contains("moving");
    el.classList.toggle("down",
      down.includes(ip) || (mine.length > 0 && mine.every(moving)));
  }
}

// While our channel is unreachable, watch the map through a channel on
// another node, so it keeps moving.
let observer = null;
function observe() {
  const ours = chips.get(channel)?.ip;
  const via = fleet.find((f) => f.up && f.node && f.node !== ours);
  if (observer || !via) return;
  const s = observer = sock(`/ws/${via.c}?observe`);
  s.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.fleet) render(m);
  };
  s.onclose = () => {
    if (observer === s) observer = null;
    if (ws?.readyState !== 1) setTimeout(observe, 500);
  };
}
function unobserve() {
  const s = observer;
  observer = null;
  s?.close();
}

// ---- chat ----
let channel, ws, node, lostAt = 0, heard = 0, backoff = 250;

function line(m) {
  const d = document.createElement("div");
  const b = document.createElement("b");
  const me = m.nick === nick;
  d.className = me ? "msg me" : "msg";
  b.textContent = me ? "you" : m.nick;
  if (!me) b.style.color = `hsl(${hue(m.nick)} 55% 45%)`;
  d.append(b, m.text);
  return d;
}

function status(text, bad) {
  $("status").textContent = text;
  $("status").classList.toggle("bad", !!bad);
}

function connect() {
  if (ws) { ws.onclose = null; ws.close(); }
  const s = ws = sock(`/ws/${channel}?nick=${encodeURIComponent(nick)}`);
  heard = Date.now();
  s.onclose = () => lost(s);
  s.onmessage = (e) => {
    heard = Date.now();
    const m = JSON.parse(e.data), log = $("log");
    if (m.type === "hello") {
      nodes = m.nodes;
      nodes.forEach((n) => box(n.ip));
      node = m.node;
      lostAt = 0;
      backoff = 250;
      unobserve();
      status("on " + nameOf(node));
      log.replaceChildren(...m.history.map(line));
      log.scrollTop = log.scrollHeight;
    }
    if (m.type === "msg") {
      log.append(line(m));
      while (log.children.length > 200) log.firstChild.remove();
      log.scrollTop = log.scrollHeight;
    }
    if (m.fleet) render(m);
  };
}

// A powered-off node sends no reset, so a dead socket can look open for
// minutes. Every channel ticks every 2 s; silence for 5 s means it is gone.
// Don't wait for onclose: a live proxy holds the close handshake open
// toward the dead node for ~30 s.
setInterval(() => {
  if (ws?.readyState === 1 && Date.now() - heard > 5000) lost(ws);
}, 1000);

function lost(s) {
  if (s !== ws) return;
  ws = null;
  s.onclose = null;
  s.close();
  status("lost our node, reconnecting", true);
  lostAt ||= Date.now();
  observe();
  setTimeout(retry, backoff);
  backoff = Math.min(backoff * 2, 2000);
}

// Reconnect once our channel is back on another node. Connecting sooner
// would claim it on whichever node the proxy picks, and a roomful of
// phones would beat the heir every time.
function retry() {
  if (ws) return;
  const f = fleet.find((f) => f.c === channel);
  const age = Date.now() - lostAt;
  if (!f || !node || (f.up && f.node !== node) || age > 20000 ||
      (age > 8000 && !down.includes(node))) connect();
  else setTimeout(retry, 250);
}

$("form").onsubmit = (e) => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text || ws?.readyState !== 1) return;
  ws.send(JSON.stringify({ text }));
  $("text").value = "";
};

window.onhashchange = () => {
  const c = location.hash.slice(1);
  channel = /^[a-z]+$/.test(c) ? c : "connect";
  $("title").textContent = document.title = "#" + channel;
  for (const [k, r] of chips) r.el.classList.toggle("on", k === channel);
  $("log").replaceChildren();
  connect();
};
window.onhashchange();
</script>
</body>
</html>
